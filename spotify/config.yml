# go-librespot: turns the bar PC into a Spotify Connect speaker.
# Pick "Wexer 2.0" once from the Spotify app on the same wifi;
# the login is then remembered.
device_name: Wexer 2.0
device_type: speaker
audio_backend: pulseaudio
# Announce the speaker through the host's avahi daemon (reached over dbus)
zeroconf_enabled: true
zeroconf_backend: avahi
credentials:
  type: zeroconf
  zeroconf:
    persist_credentials: true
server:
  enabled: true
  address: 0.0.0.0
  port: 3678
# Track metadata around the playback position, so the screen can show
# the next songs (next_track and /context/tracks)
metadata:
  enabled: true
  context_sweep: false
  max_tracks: 400
