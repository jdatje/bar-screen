# Wexer 2.0 — balenaOS fleet (generic x86-64 mini PC)
# Deployed automatically by .github/workflows/deploy.yml on every push to main.
version: "2.1"

volumes:
  app-data:
  browser-settings:
  spotify-data:

services:
  # Wexer: screen UI, phone UI, Spotify control, game logic
  app:
    build: ./app
    restart: always
    ports:
      - "80:80"
      # Spotify login callback (http://127.0.0.1:8888/auth/spotify/callback)
      - "8888:8888"
    volumes:
      - app-data:/data
    labels:
      # lets the app ask balena for the device's LAN IP (for the join QR code)
      io.balena.features.supervisor-api: "1"
    environment:
      - PORT=80
      - DATA_DIR=/data
      # Set these as fleet/device variables in balenaCloud, not here:
      # SPOTIFY_CLIENT_ID, SPOTIFY_CLIENT_SECRET
      # PUBLIC_URL (optional, e.g. the balena public device URL) for the join QR code

  # Full-screen Chromium kiosk on the touchscreen
  browser:
    image: bh.cr/balenalabs/browser-amd64
    restart: always
    privileged: true
    network_mode: host
    volumes:
      - browser-settings:/data
    labels:
      # dbus from the host, shared with the audio container
      io.balena.features.dbus: "1"
    environment:
      - DBUS_SYSTEM_BUS_ADDRESS=unix:path=/host/run/dbus/system_bus_socket
      # play web audio through the audio container
      - PULSE_SERVER=tcp:localhost:4317
      - LAUNCH_URL=http://localhost
      - KIOSK=1
      # No Chrome popups, bubbles or prompts on the kiosk (added to the block's defaults)
      - >-
        EXTRA_FLAGS=--no-first-run --no-default-browser-check --disable-infobars
        --disable-notifications --deny-permission-prompts --password-store=basic
        --disable-translate --disable-sync --check-for-update-interval=31536000
        --disable-features=Translate,TranslateUI,MediaRouter,GlobalMediaControls,DownloadBubble,PasswordManagerOnboarding,AutofillServerCommunication,PrivacySandboxSettings4
      - PERSISTENT=1
      - SHOW_CURSOR=0

  # PulseAudio router for the device's audio output
  audio:
    # balena audio block with a fix for the amixer startup crash (see audio/Dockerfile)
    build: ./audio
    restart: always
    privileged: true
    labels:
      io.balena.features.dbus: "1"
    environment:
      - DBUS_SYSTEM_BUS_ADDRESS=unix:path=/host/run/dbus/system_bus_socket
    ports:
      - "4317:4317"

  # Spotify Connect receiver: the bar shows up as a speaker in Spotify
  spotify:
    build: ./spotify
    restart: always
    network_mode: host
    volumes:
      # Seeded from the image on first start; keeps the Spotify login across updates
      - spotify-data:/config
    labels:
      # dbus from the host, shared with the audio container (also used for avahi/zeroconf)
      io.balena.features.dbus: "1"
    environment:
      - DBUS_SYSTEM_BUS_ADDRESS=unix:path=/host/run/dbus/system_bus_socket
      - PULSE_SERVER=tcp:localhost:4317
    depends_on:
      - audio
