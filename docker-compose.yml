# Wexer 2.0 — balenaOS fleet (generic x86-64 mini PC)
# Deployed automatically by .github/workflows/deploy.yml on every push to main.
version: "2.1"

volumes:
  app-data:
  botc-data:
  browser-settings:
  spotify-data:
  games-data:
  # the shared ALSA mixer config (written by spotify, read by browser)
  audio-config:

services:
  # Wexer: screen UI, phone UI, Spotify control, game logic
  app:
    build: ./app
    restart: always
    # host network: reaches the speaker's local API on 127.0.0.1:3678 and
    # serves the screen on port 80 and the Spotify login on port 8888
    network_mode: host
    volumes:
      - app-data:/data
    labels:
      # lets the app ask balena for the device's LAN IP (for the join QR code)
      io.balena.features.supervisor-api: "1"
    environment:
      - PORT=80
      - DATA_DIR=/data
      # Set these as fleet/device variables in balenaCloud, not here:
      # SPOTIFY_CLIENT_ID, SPOTIFY_CLIENT_SECRET
      # PUBLIC_URL (optional, e.g. the balena public device URL) for the join QR code

  # Full-screen Chromium kiosk on the touchscreen
  browser:
    # the balena browser block, plus the shared sound config (see browser/)
    build: ./browser
    restart: always
    privileged: true
    network_mode: host
    # shared memory with spotify, for the shared ALSA mixer
    ipc: host
    volumes:
      - browser-settings:/data
      - audio-config:/shared
    labels:
      # dbus from the host
      io.balena.features.dbus: "1"
    environment:
      - DBUS_SYSTEM_BUS_ADDRESS=unix:path=/host/run/dbus/system_bus_socket
      - LAUNCH_URL=http://localhost
      - KIOSK=1
      # GPU rendering: needed to run N64 games smoothly in the browser
      - ENABLE_GPU=1
      # udev in the container: controllers are recognised, also when plugged in later
      - UDEV=1
      # No Chrome popups, bubbles or prompts on the kiosk (added to the block's defaults)
      - >-
        EXTRA_FLAGS=--no-first-run --no-default-browser-check --disable-infobars
        --disable-notifications --deny-permission-prompts --password-store=basic
        --disable-translate --disable-sync --check-for-update-interval=31536000
        --disable-features=Translate,TranslateUI,MediaRouter,GlobalMediaControls,DownloadBubble,PasswordManagerOnboarding,AutofillServerCommunication,PrivacySandboxSettings4
      - PERSISTENT=1
      - SHOW_CURSOR=0

  # Spotify Connect receiver: the bar shows up as a speaker in Spotify
  spotify:
    build: ./spotify
    restart: always
    network_mode: host
    # shared memory with the browser, for the shared ALSA mixer
    ipc: host
    volumes:
      # Seeded from the image on first start; keeps the Spotify login across updates
      - spotify-data:/config
      - audio-config:/shared
    labels:
      # dbus from the host (avahi/zeroconf)
      io.balena.features.dbus: "1"
    # direct access to the sound card (ALSA)
    privileged: true
    environment:
      - DBUS_SYSTEM_BUS_ADDRESS=unix:path=/host/run/dbus/system_bus_socket

  # Retro games: your own game files + the EmulatorJS player page.
  # Only reachable on 127.0.0.1; the app serves it on /games.
  games:
    build: ./games
    restart: always
    network_mode: host
    volumes:
      - games-data:/data

  # Blood on the Clocktower: the jdatje/botc repo (latest main at every start), port 8090.
  # Phones and the kiosk open it on the bar's LAN address; the app keeps the bar's
  # fixed game room ("house room") and its storyteller code (= the admin code) in sync.
  botc:
    build: ./botc
    restart: always
    network_mode: host
    volumes:
      - botc-data:/data
    environment:
      - PORT=8090
      - DATA_DIR=/data
      - HOUSE_CODE=WEXER
      # same as BOTC_HOST_SECRET in the app (default there: wexer-house-room)
      - HOST_SECRET=wexer-house-room
