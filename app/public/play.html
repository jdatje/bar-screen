<!doctype html>
<html lang="nl" translate="no" data-theme="industrial">
<head>
<meta charset="utf-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1B1C1E">
<title>Wexer 2.0 — Meedoen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="/css/themes.css">
<link rel="stylesheet" href="/css/app.css">
</head>
<body class="phone-body">
<main class="phone">
  <div class="p-head">
    <span class="display" style="font-size:24px;letter-spacing:3px">Wexer 2.0</span>
    <span class="mono muted" id="me"></span>
  </div>

  <form id="join" style="display:flex;flex-direction:column;gap:18px">
    <h1 class="display p-title">Doe mee</h1>
    <div class="field">
      <label for="code">Kamercode (staat op het scherm)</label>
      <input id="code" class="code" maxlength="4" autocomplete="off" autocapitalize="characters" required>
    </div>
    <div class="field">
      <label for="name">Je naam of teamnaam</label>
      <input id="name" maxlength="24" autocomplete="nickname" required>
    </div>
    <span class="error" id="error" role="alert"></span>
    <button class="btn primary" type="submit" style="font-size:20px">Meedoen</button>
    <a class="mono muted" href="/admin" style="text-align:center;text-decoration:none;padding:12px">🔒 Beheer</a>
  </form>

  <section id="tab-game" hidden></section>
  <section id="tab-cocktails" hidden></section>
  <section id="tab-requests" hidden>
    <span class="mono accent">Verzoekjes</span>
    <h1 class="display p-title">Welk nummer wil je horen?</h1>
    <form class="field" id="req-form"><label for="req-q">Zoek een nummer of artiest</label><input id="req-q" autocomplete="off" enterkeyhint="search"></form>
    <div class="p-list" id="req-results"></div>
    <span class="mono muted" id="req-mine-head" hidden>Jouw verzoekjes</span>
    <div class="p-list" id="req-mine"></div>
  </section>
  <section id="tab-photos" hidden>
    <span class="mono accent">Fotomuur</span>
    <h1 class="display p-title">Zet je foto op het scherm</h1>
    <label class="btn primary big photo-pick" for="photo-file">📸 Foto maken of kiezen</label>
    <input type="file" id="photo-file" accept="image/*" multiple hidden>
    <span class="muted" id="photo-status"></span>
    <div class="p-photos" id="my-photos"></div>
    <div class="p-save">
      <span class="mono accent">Foto's opslaan</span>
      <button class="btn big" id="save-open" type="button">⬇️ Kies foto's om op te slaan</button>
    </div>
  </section>
  <section class="p-picker" id="picker" hidden>
    <div class="p-picker-head">
      <button class="btn small" id="pick-close" type="button">Terug</button>
      <span id="pick-count">0 gekozen</span>
      <button class="btn small" id="pick-all" type="button">Alles</button>
    </div>
    <div class="p-pick-grid" id="pick-grid"></div>
    <div class="p-picker-foot">
      <button class="btn primary big" id="pick-save" type="button" disabled>Opslaan</button>
    </div>
  </section>
</main>

<nav class="p-tabs four" id="tabs" hidden>
  <button data-tab="game" class="on">Spel</button>
  <button data-tab="requests">Verzoekjes</button>
  <button data-tab="photos">Foto's</button>
  <button data-tab="cocktails">Cocktails</button>
</nav>

<script src="/socket.io/socket.io.js"></script>
<script src="/js/play.js" type="module"></script>
</body>
</html>
